<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="국립중앙박물관과 국립현대미술관 서울·과천관의 혼잡도를 모아 현재 상황을 보여주고, 쌓인 데이터로 시간대별 혼잡도를 예측합니다."
    />
    <meta property="og:site_name" content="전시 혼잡도 예측" />
    <!-- 구글 검색 결과의 사이트 이름. 이게 없으면 구글이 이름을 스스로 고르는데,
         duckdns.org 가 공개 접미사라 이 하위 도메인이 독립 사이트로 잡히면서도
         "Duck DNS" 로 표시됐다. 홈 페이지에만 있으면 되고, 이름은
         useDocumentTitle 의 SITE 와 같아야 한다. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "전시 혼잡도 예측",
        "url": "https://exhibition-traffic.duckdns.org/"
      }
    </script>
    <title>국립중앙박물관·국립현대미술관 혼잡도</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
