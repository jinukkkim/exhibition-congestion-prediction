name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # develop 대상 PR만 자동 리뷰 — develop→main 머지 PR은 이미 리뷰된 코드라 제외
    # (필요 시 PR에 @claude 멘션으로 수동 리뷰 가능)
    branches: [develop]
    # Optional: Only run on specific file changes
    # paths:
    #   - "backend/**/*.py"
    #   - "frontend/src/**/*.ts"
    #   - "frontend/src/**/*.tsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 0 이어야 origin/develop 이 로컬에 있다. 1(shallow)이면 리뷰어가
          # `git diff origin/develop...HEAD` 를 못 해서 매번 `git fetch` 로 손을
          # 뻗고, 그건 아래 allowedTools 에도 액션 기본 목록에도 없어 거부된다.
          #
          # 거부는 조용히 끝나지 않는다. 2026-09-06 PR #91 의 run 34048868790
          # attempt 1 은 permission_denials 16 회에 num_turns 7 로 조기 종료했고,
          # 그 전에 추적 코멘트를 마무리하는 update_claude_comment 를 못 불렀다.
          # job 은 success 라 체크는 초록인데 코멘트만 "진행 중" 스피너로 영원히
          # 남는다. 같은 PR 의 정상 run 은 num_turns 37 / 거부 9 였다 — 거부가
          # 쌓이느냐가 완주와 멈춤을 가른다.
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # 추적 코멘트를 액션이 직접 생성 — 인라인 게시가 실패해도 리뷰 결과가 항상 PR에 남음
          track_progress: true
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # 리뷰 게시에 필요한 도구 허용 — 없으면 코멘트 게시가 거부됨
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(git diff:*),Bash(git log:*),Bash(git fetch:*)"
            --append-system-prompt "PR에 게시하는 모든 리뷰 코멘트(요약·인라인 코멘트·지적사항)는 한국어로 작성하세요. 코드 식별자와 기술 용어는 원문 그대로 사용해도 됩니다."
          # 테스트 실행(pytest, npx tsc)은 일부러 열지 않는다. 같은 PR 에서
          # ci.yml 이 이미 돌리므로 리뷰어가 겹쳐 돌릴 이유가 없고, 열면 러너
          # 시간과 토큰만 늘어난다. 리뷰가 "직접 실행해 검증하지 못했다"고
          # 밝히는 편이 정확하다.
          #
          # concurrency + cancel-in-progress 는 넣지 않는다. 중복 리뷰를 줄이려고
          # 흔히 더하는 설정이지만, 취소된 run 은 추적 코멘트를 마무리하지 못해
          # 위 fetch-depth 주석이 말하는 그 "진행 중" 상태를 확정적으로 만든다.
          #
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
